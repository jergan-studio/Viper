<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viper AI - Code Upgrader</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <h1>🟣 Viper AI</h1>
    <p>Paste code → get upgraded version</p>

    <!-- INPUT -->
    <textarea id="code" placeholder="Paste HTML / CSS / JS here..."></textarea>

    <!-- BUTTON -->
    <button onclick="upgrade()">Upgrade Code</button>

    <!-- STATUS -->
    <p id="status"></p>

    <!-- OUTPUT -->
    <h3>Upgraded Code</h3>
    <pre id="output"></pre>

    <!-- COPY BUTTON -->
    <button onclick="copyCode()">Copy Output</button>
  </div>

  <script>
    async function upgrade() {
      const code = document.getElementById("code").value;
      const output = document.getElementById("output");
      const status = document.getElementById("status");

      if (!code.trim()) {
        status.textContent = "❌ Please paste some code first";
        return;
      }

      status.textContent = "⏳ Upgrading...";
      output.textContent = "";

      try {
        const res = await fetch("/api/upgrade", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        const data = await res.json();

        if (data.error) {
          status.textContent = "❌ Error: " + data.error;
          return;
        }

        output.textContent = data.upgraded;
        status.textContent = "✅ Upgrade complete";

      } catch (err) {
        status.textContent = "❌ Server not responding";
        console.error(err);
      }
    }

    function copyCode() {
      const output = document.getElementById("output").textContent;

      if (!output) return;

      navigator.clipboard.writeText(output);
      alert("Copied Viper output!");
    }
  </script>

</body>
</html>
