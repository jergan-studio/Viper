<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Viper AI - Code Upgrader</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">
    <h1>🟣 Viper AI</h1>
    <p>Paste your code and get an upgraded version</p>

    <!-- INPUT -->
    <textarea id="code" placeholder="Paste HTML / CSS / JS here..."></textarea>

    <!-- ACTION BUTTON -->
    <button onclick="upgradeCode()">Upgrade Code</button>

    <!-- STATUS -->
    <p id="status"></p>

    <!-- OUTPUT -->
    <h3>Output</h3>
    <pre id="output"></pre>

    <!-- COPY -->
    <button onclick="copyOutput()">Copy Output</button>
  </div>

  <script>
    async function upgradeCode() {
      const code = document.getElementById("code").value;
      const status = document.getElementById("status");
      const output = document.getElementById("output");

      if (!code.trim()) {
        status.textContent = "❌ Please paste some code first";
        return;
      }

      status.textContent = "⏳ Upgrading...";
      output.textContent = "";

      try {
        const res = await fetch("/api/upgrade", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ code })
        });

        // IMPORTANT: read raw text first (prevents JSON crash)
        const text = await res.text();

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          status.textContent = "❌ Invalid server response";
          output.textContent = text;
          return;
        }

        if (data.error) {
          status.textContent = "❌ Error: " + data.error;
          return;
        }

        output.textContent = data.upgraded;
        status.textContent = "✅ Upgrade complete";

      } catch (err) {
        console.error(err);
        status.textContent = "❌ Server not responding";
      }
    }

    function copyOutput() {
      const text = document.getElementById("output").textContent;

      if (!text) return;

      navigator.clipboard.writeText(text);
      alert("Copied Viper output!");
    }
  </script>

</body>
</html>
