<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Viper AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <div class="header">
      <h1>🟣 Viper AI</h1>
      <p>Code Upgrader Engine</p>
    </div>

    <!-- MAIN GRID -->
    <div class="grid">

      <!-- INPUT PANEL -->
      <div class="panel">
        <h3>Input Code</h3>
        <textarea id="code" placeholder="Paste HTML / CSS / JS here..."></textarea>

        <button onclick="upgrade()">⚡ Upgrade Code</button>
        <p id="status"></p>
      </div>

      <!-- OUTPUT PANEL -->
      <div class="panel">
        <h3>Viper Output</h3>
        <pre id="output"></pre>

        <button onclick="copyCode()">📋 Copy</button>
      </div>

    </div>

  </div>

<script>
async function upgrade() {
  const code = document.getElementById("code").value;
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  status.textContent = "Upgrading...";
  output.textContent = "";

  const res = await fetch("/api/upgrade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });

  const data = await res.json();

  if (data.error) {
    status.textContent = "Error: " + data.error;
    return;
  }

  output.textContent = data.upgraded;
  status.textContent = "Done ✔";
}

function copyCode() {
  navigator.clipboard.writeText(
    document.getElementById("output").textContent
  );
  alert("Copied!");
}
</script>

</body>
</html>
