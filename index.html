<!DOCTYPE html>
<html>
<head>
  <title>Viper AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Viper AI - Code Upgrader</h1>

    <select id="lang">
      <option value="auto">Auto</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JavaScript</option>
    </select>

    <textarea id="code" placeholder="Paste your code here..."></textarea>

    <button onclick="upgrade()">Upgrade Code</button>

    <h3>Viper Output</h3>
    <pre id="output"></pre>

    <button onclick="copyCode()">Copy Output</button>
  </div>

<script>
async function upgrade() {
  const code = document.getElementById("code").value;
  const language = document.getElementById("lang").value;
  const output = document.getElementById("output");

  output.textContent = "Upgrading...";

  const res = await fetch("/api/upgrade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code, language })
  });

  const data = await res.json();

  output.textContent = data.upgraded || data.error;
}

function copyCode() {
  const text = document.getElementById("output").textContent;
  navigator.clipboard.writeText(text);
  alert("Copied Viper output!");
}
</script>

</body>
</html>
