<!DOCTYPE html>
<html>
<head>
  <title>Viper AI Tabs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <h1>🟣 Viper AI</h1>

  <div class="layout">

    <!-- INPUT -->
    <div>
      <textarea id="code" placeholder="Paste full project code..."></textarea>
      <button onclick="upgrade()">Upgrade</button>
      <p id="status"></p>
    </div>

    <!-- OUTPUT TABS -->
    <div>

      <div class="tabs">
        <button onclick="showTab('html')">HTML</button>
        <button onclick="showTab('css')">CSS</button>
        <button onclick="showTab('js')">JS</button>
      </div>

      <pre id="output"></pre>

      <button onclick="copyTab()">Copy Current Tab</button>
    </div>

  </div>

</div>

<script>

let currentTab = "html";
let resultData = {};

function showTab(tab) {
  currentTab = tab;
  document.getElementById("output").textContent =
    resultData[tab] || "";
}

async function upgrade() {
  const code = document.getElementById("code").value;
  const status = document.getElementById("status");

  status.textContent = "Upgrading...";

  const res = await fetch("/api/upgrade", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code })
  });

  const data = await res.json();

  if (data.error) {
    status.textContent = data.error;
    return;
  }

  resultData = {
    html: data.html || "",
    css: data.css || "",
    js: data.js || ""
  };

  status.textContent = "Done ✔";

  showTab(currentTab);
}

function copyTab() {
  navigator.clipboard.writeText(resultData[currentTab] || "");
  alert(currentTab.toUpperCase() + " copied!");
}

</script>

</body>
</html>
