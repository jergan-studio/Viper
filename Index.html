<!DOCTYPE html>
<html>
<head>
    <title>Viper AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🐍 Viper AI</h1>

    <textarea id="inputCode"
        placeholder="Paste code here..."></textarea>

    <button onclick="upgradeCode()">
        Upgrade Code
    </button>

    <h2>Improved Code</h2>

    <textarea id="outputCode"></textarea>

    <button onclick="copyCode()">
        Copy
    </button>
</div>

<script src="app.js"></script>

</body>
</html>
